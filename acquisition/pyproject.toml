[project]
name = "founder-guide"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["yt-dlp>=2024.8"]
books = ["PyMuPDF>=1.24", "ebooklib>=0.18"]

[project.scripts]
guide = "founder_guide:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
founder_guide = [
    "demo_transcript.json",
    "demo_catalog.json",
    "demo_transcripts.json",
]
