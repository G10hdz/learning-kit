name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash -n scripts/*.sh
      - run: python -m py_compile scripts/ingest.py tools/score_sources.py
      - run: python -m unittest discover -s tests
