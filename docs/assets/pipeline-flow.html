<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>learning-kit · Flujo</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f7f7f9;
      --color-ink: #26233d;
      --font-sans: 'Geist', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">

<svg viewBox="0 0 1280 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lk-t lk-d">
  <title id="lk-t">learning-kit · contenedores</title>
  <desc id="lk-d">Pipeline de estudio: fuentes a acquisition, NotebookLM, production, practice y surface; vault y memory debajo.</desc>
  <style>
    svg {
      --paper:#f7f7f9; --paper2:#ffffff; --ink:#26233d; --muted:#5d6478;
      --soft:#9a9db2; --rule:rgba(38,35,61,.12); --accent:#7c5cf0;
      --atint:rgba(124,92,240,.08); --link:#4f46e5;
      --store:rgba(38,35,61,.05); --zonef:rgba(38,35,61,.02);
      --zones:rgba(38,35,61,.10); --input:rgba(93,100,120,.10);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper:#14121f; --paper2:#211f30; --ink:#efedfb; --muted:#a49ece;
        --soft:#787a94; --rule:rgba(239,237,251,.14); --accent:#bb86ff;
        --atint:rgba(187,134,255,.14); --link:#8f9bff;
        --store:rgba(239,237,251,.07); --zonef:rgba(239,237,251,.03);
        --zones:rgba(239,237,251,.12); --input:rgba(164,158,206,.10);
      }
    }
    .t-name    { font: 600 12px 'Geist', sans-serif; fill: var(--ink); }
    .t-sub     { font: 9px 'Geist Mono', monospace; fill: var(--muted); }
    .t-tag     { font: 7px 'Geist Mono', monospace; fill: var(--soft); letter-spacing: .08em; }
    .t-lab     { font: 8px 'Geist Mono', monospace; fill: var(--soft); letter-spacing: .06em; }
    .t-eye     { font: 8px 'Geist Mono', monospace; fill: var(--soft); letter-spacing: .18em; }
    .t-zone    { font: 7px 'Geist Mono', monospace; fill: var(--soft); letter-spacing: .14em; }
    .t-title   { font: 28px 'Instrument Serif', serif; fill: var(--ink); }
    .t-cap     { font: 8px 'Geist Mono', monospace; fill: var(--soft); }
    .b-input   { fill: var(--input); stroke: var(--soft); }
    .b-node    { fill: var(--paper2); stroke: var(--ink); }
    .b-focal   { fill: var(--atint); stroke: var(--accent); }
    .b-store   { fill: var(--store); stroke: var(--muted); }
    .tag       { fill: none; stroke: var(--rule); }
    .mask      { fill: var(--paper); }
    .zone      { fill: var(--zonef); stroke: var(--zones); }
    .edge      { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .edge-link { fill: none; stroke: var(--link); stroke-width: 1.2; }
    .mk-m      { fill: var(--muted); }
    .mk-l      { fill: var(--link); }
    .token     { fill: var(--accent); stroke: var(--paper); stroke-width: 1.5; }
    @media (prefers-reduced-motion: reduce) { .token { display: none; } }
  </style>

  <!-- flow token: libro viajando el pipeline (decorativo) -->
  <circle class="token" r="5.5" aria-hidden="true" focusable="false">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="0" calcMode="linear"

      keyPoints="0;0.19;0.19;0.35;0.35;0.62;0.62;0.81;0.81;1">
